  - id: t_000
    type: io.kestra.plugin.scripts.node.Script
    script: |
      function fibo(n) {
        if (n <= 1) {
          return n
        } else {
          return fibo(n-1) + fibo(n-2)
        }
      }
      console.log(fibo(33))
