services:
  db:
    image: postgres:16
    container_name: prefect-db
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prefect
    command: postgres -c max_connections=300
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 3s
      timeout: 3s
      retries: 30

  server:
    image: prefecthq/prefect:3.8.6-python3.12
    container_name: prefect-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD}@db:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://127.0.0.1:4200/api
    command: prefect server start --host 0.0.0.0 --port 4200
    ports:
      - "4200:4200"

  client:
    image: prefecthq/prefect:3.8.6-python3.12
    container_name: prefect-client
    depends_on:
      - server
    environment:
      PREFECT_API_URL: http://server:4200/api
    volumes:
      # the directory holding run_bench.py
      - ${BENCH_DIR:-.}:/bench
    working_dir: /bench
    entrypoint: ["sleep", "infinity"]

volumes:
  pgdata:
